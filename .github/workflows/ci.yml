name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tab-pulse.tmux test/test_helper.bash

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS matters here, not just for parity: the daemon's own comments
        # document macOS-stock-awk-only bugs (e.g. Braille-locale collation
        # breaking change-detection) that an Ubuntu-only run would never
        # catch.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux and bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux bats jq

      - name: Install tmux and bats (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux bats-core jq

      - name: Verify bash version (macOS)
        # None of the above are known to pull in a newer bash as a dependency,
        # so `#!/usr/bin/env bash` should still resolve to the stock 3.2 this
        # code's own comments call out as a design constraint - but that's an
        # assumption about the runner image, not a guarantee. Fail loudly if
        # it ever stops holding, rather than silently losing bash-3.2 coverage.
        if: runner.os == 'macOS'
        run: |
          bash --version
          [[ "$(bash --version)" == *"version 3."* ]] || {
            echo "::error::Default bash is not 3.x - this job no longer exercises the bash-3.2 compatibility this code depends on. See comments in scripts/daemon.sh."
            exit 1
          }

      - name: Run test suite
        run: bats test/*.bats
