name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS matters here, not just for parity: the daemon's own comments
        # document macOS-stock-awk-only bugs (e.g. Braille-locale collation
        # breaking change-detection) that an Ubuntu-only run would never
        # catch.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux and bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux bats jq

      - name: Install tmux and bats (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux bats-core jq

      - name: Run test suite
        run: bats test/*.bats
